name: release

# A tag v* builds the packages from this repository on GitHub's own machines,
# tests them in clean containers and publishes them as a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y podman rsync file binutils dpkg-dev >/dev/null
          podman --version

      - name: Version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/lguard/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but version $v"; exit 1; }

      - name: Fetch and verify sources
        run: build/fetch-sources.sh

      - name: Build scan engine (ClamAV and its libraries, glibc 2.28)
        run: build/build-clamav.sh

      - name: Build runtime (Python and hash-pinned packages)
        run: build/build-python.sh

      - name: Assemble and check glibc
        run: build/assemble.sh

      - name: Build .deb and .rpm
        run: build/package.sh

      - name: Install test in clean containers
        run: build/test-install.sh --smoke docker.io/library/debian:12 docker.io/library/ubuntu:24.04 docker.io/library/oraclelinux:8 docker.io/library/oraclelinux:9

      - name: Checksums
        run: cd build/out && sha256sum *.deb *.rpm > SHA256SUMS && cat SHA256SUMS

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          cat > notes.md <<NOTES
          Lguard $v for x86_64, any distribution with glibc 2.28 or newer.

          | Package | For |
          |---|---|
          | \`lguard_${v}_amd64.deb\` | Debian 10+, Ubuntu 20.04+ (protection, scan engine) |
          | \`lguard-gui_${v}_amd64.deb\` | Debian / Ubuntu desktop app |
          | \`lguard-${v}-1.x86_64.rpm\` | RHEL / Oracle Linux / AlmaLinux / Rocky 8+, Fedora |
          | \`lguard-gui-${v}-1.x86_64.rpm\` | RHEL family / Fedora desktop app |

          Servers need only \`lguard\`. Install both packages together:

              sudo apt install ./lguard_${v}_amd64.deb ./lguard-gui_${v}_amd64.deb
              sudo dnf install ./lguard-${v}-1.x86_64.rpm ./lguard-gui-${v}-1.x86_64.rpm

          Built by GitHub Actions from this tag; checksums in SHA256SUMS.
          NOTES
          gh release create "$GITHUB_REF_NAME" --title "Lguard $v" --notes-file notes.md \
            build/out/*.deb build/out/*.rpm build/out/SHA256SUMS

      - name: Keep packages of manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: lguard-packages
          path: |
            build/out/*.deb
            build/out/*.rpm
            build/out/SHA256SUMS

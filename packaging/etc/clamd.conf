# Lguard's private clamd. Not the system's ClamAV; never shares its files.
LocalSocket /run/lguard-clamd/clamd.sock
LocalSocketGroup lguard
LocalSocketMode 660
Foreground yes
DatabaseDirectory /var/lib/lguard/clamav
TemporaryDirectory /var/tmp
LogSyslog yes
LogFacility LOG_DAEMON
MaxThreads 4
MaxQueue 200
# Big archives, disk images and installers are scanned whole. Whatever
# still exceeds a limit is reported as such (Lguard records the file as
# "partly checked", never as clean).
MaxFileSize 2000M
MaxScanSize 4000M
MaxScanTime 900000
StreamMaxLength 400M
AlertExceedsMax yes
ConcurrentDatabaseReload no
SelfCheck 3600
ExitOnOOM yes
CVDCertsDirectory /opt/lguard/clamav/etc/certs
